# Live-sync configuration. Copy this file to `livesync.config.yaml` (same dir)
# and edit values for the host it runs on. The watcher reads only the .yaml
# (without `.example`), so the template stays in git untouched.

# Repo root on the host running the watcher. All other repo-relative paths
# are resolved from here.
repo_root: "D:/DIREKT/Worker guidance/Omniverse-UnityAR-WorkerGuidance"

# The job to rebuild on every change. Also the Nucleus output subfolder name.
job_id: "Segment_Assembly"

# ── Job source on Nucleus ────────────────────────────────────────────────
# Root Nucleus folder of the JOB (the Animation Export folder). Everything else
# is derived from it by convention (override individually below if it differs):
#   {nucleus_job_root}/                             -> the step_id_<M>_<N>_Animation.usd files (in the root)
#   {nucleus_job_root}/JSON/*.json                  -> assembly definition (drives the steps)
#   {nucleus_job_root}/model_target/  (.dat + .xml) -> Vuforia Model Target (discovered, copied as-is)
# Leave empty for now if the JOB folder isn't finalized; fill before a run.
nucleus_job_root: ""   # e.g. "omniverse://141.43.76.21/Projects/DIREKT/Project Assembly/Source/Animation Export"

# Nucleus host prefix for the output root below. Rarely needs changing.
nucleus_host: "omniverse://141.43.76.21"

# Optional explicit overrides. Leave empty to use the derived paths above.
assembly_definition_url: ""   # full URL to assembly_definition.json (else discovered in {job_root}/JSON)
animation_source_dir: ""      # folder holding the *_Animation.usd (else {job_root} itself)
model_target_dir: ""          # folder holding the .dat/.xml (else {job_root}/model_target)

# Nucleus paths to watch. LEAVE EMPTY to auto-derive from assembly_definition.json:
# the watcher will watch the JSON itself, the model_target .dat/.xml, and every
# is_animation step's *_Animation.usd -- so you never hand-maintain this list.
# Only set an explicit list to override that (e.g. legacy per-part jobs).
watch_paths: []

# How often to check Nucleus for changes, in seconds.
poll_interval_sec: 5

# Quiet period after the LAST detected change before triggering a rebuild.
# Prevents firing on every intermediate save during active editing.
debounce_sec: 10

# How long the pipeline_runner is allowed to take, in seconds, before the
# watcher considers it stuck and logs an error. The export of 7 GLBs plus
# automate_job typically finishes in ~60s; leave generous headroom.
pipeline_timeout_sec: 600

# Command that launches Kit headlessly and runs export_glbs_from_usd.py.
# This is the line most likely to need adjustment on a new host.
#
# The repo.bat in kit-app-template-109-0-3 forwards `--` args through to the
# underlying kit executable. Verify on AT21 by running it manually once;
# if the syntax differs, adjust just this string.
kit_app_dir: "D:/Omniverse/Omniverse_Apps/kit-app-template-109-0-3"
kit_export_command: >
  cmd /c "cd /d {kit_app_dir} && repo.bat launch -- --no-window
  --exec {repo_root}/server-kit/app/omniverse/export_glbs_from_usd.py"

# Nucleus path (under nucleus_host / SERVER) where the Kit exporter drops the
# GLBs and _export_report.json. The exporter writes to:
#     <nucleus_host><nucleus_export_root>/<job_id>/
# and prepare_job() reads back:
#     <SERVER><nucleus_export_root>/<job_id>/_export_report.json
nucleus_export_root: "/Users/abdul"

# NOTE: The Vuforia Model Target is no longer named here. prepare_job discovers
# the single .dat/.xml in the Nucleus model_target folder (see model_target_dir /
# nucleus_job_root above) and copies them verbatim into shared/samples/targets/.

# Optional: the venv used to manually run automate_job.py / build_runtime_packages.py.
# NOT used by the live-sync pipeline anymore (prepare_job replaces both).
# Kept for reference if you ever want to invoke them by hand.
venv_python: "D:/DIREKT/Worker guidance/Omniverse-UnityAR-WorkerGuidance/venv/Scripts/python.exe"

# Where to write logs. Created if missing.
log_dir: "D:/DIREKT/Worker guidance/Omniverse-UnityAR-WorkerGuidance/tools/packaging/livesync/logs"

# Where to persist the last-seen modification times so a watcher restart
# doesn't re-trigger a build for files that haven't actually changed.
state_file: "D:/DIREKT/Worker guidance/Omniverse-UnityAR-WorkerGuidance/tools/packaging/livesync/.livesync_state.json"
