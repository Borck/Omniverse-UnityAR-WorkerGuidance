syntax = "proto3";

package guidance.v1;

option csharp_namespace = "Guidance.V1";

service GuidanceSessionService {
  rpc Connect(stream ClientMessage) returns (stream ServerMessage);
}

service AssetQueryService {
  rpc GetManifest(ManifestRequest) returns (AssetManifest);
}

service AssetTransferService {
  rpc StreamStepAsset(StepAssetStreamRequest) returns (stream StepAssetChunk);
}

// Lets an external system (dashboard, MES, supervisor tool) drive the step a
// connected device is on, without being the device's session client. The server
// resolves the target step and pushes StepActivated to the matching session(s)
// over their existing Connect() stream via SessionChannels.
service GuidanceControlService {
  rpc ControlStep(ControlStepRequest) returns (ControlStepResponse);
  rpc GetStatus(StatusRequest) returns (StatusResponse);
  rpc DisconnectSession(DisconnectSessionRequest) returns (DisconnectSessionResponse);
}

message ClientMessage {
  oneof payload {
    HelloRequest hello = 1;
    Heartbeat heartbeat = 2;
    TrackingState tracking_state = 3;
    UserAction user_action = 4;
    StepCompleted step_completed = 5;
    Fault fault = 6;
  }
}

message ServerMessage {
  oneof payload {
    HelloResponse hello_response = 1;
    AssignJob assign_job = 2;
    StepActivated step_activated = 3;
    CancelStep cancel_step = 4;
    Ping ping = 5;
    Fault fault = 6;
    ManifestUpdated manifest_updated = 7;
  }
}

message HelloRequest {
  string device_id = 1;
  string app_version = 2;
  string capabilities = 3;
}

message HelloResponse {
  string session_id = 1;
  string protocol_version = 2;
  int64 server_time_unix_ms = 3;
}

message AssignJob {
  string job_id = 1;
  string workflow_version = 2;
  string manifest_url = 3;
}

message StepActivated {
  string job_id = 1;
  string step_id = 2;
  string part_id = 3;
  string display_name = 4;
  string instructions_short = 5;
  repeated string safety_notes = 6;
  string asset_version = 7;
  string target_id = 8;
  string target_version = 9;
  string anchor_type = 10;
  string animation_name = 11;
  string prefetch_next_step_id = 12;
}

message StepCompleted {
  string job_id = 1;
  string step_id = 2;
  int64 completed_at_unix_ms = 3;
}

// External-control request. `action` selects how the target step is chosen:
//   GOTO     -> jump to `step_id` (required for GOTO)
//   NEXT     -> step after the session's current one (requires server-side
//               current-step tracking; not implemented in the GOTO MVP)
//   PREVIOUS -> step before the current one (same caveat as NEXT)
message ControlStepRequest {
  string job_id = 1;
  ControlAction action = 2;
  string step_id = 3;   // required when action == CONTROL_ACTION_GOTO
}

message ControlStepResponse {
  bool ok = 1;
  string activated_step_id = 2;
  int32 sessions_notified = 3;   // number of device sessions the push reached
  string message = 4;            // human-readable detail (esp. on failure)
}

message StatusRequest {}

// Snapshot of gRPC-process state for a monitoring dashboard. Sessions are
// only the ones currently attached to a live Connect() stream -- a device
// that dropped its connection is not counted even if it's still known to
// the (disk-persisted) session store.
message StatusResponse {
  int32 active_session_count = 1;
  repeated ActiveSession sessions = 2;
  // Live-sync: last time ManifestWatcher pushed a ManifestUpdated, and the
  // (job_id -> workflow_version) it currently has on disk. 0 = never.
  int64 livesync_last_broadcast_unix_ms = 3;
  map<string, string> livesync_known_jobs = 4;
  // When this gRPC process came up (process-wide, not per-session).
  int64 grpc_start_unix_ms = 5;
}

message ActiveSession {
  string session_id = 1;
  string device_id = 2;
  string job_id = 3;
  string state = 4;
  // 0 if no heartbeat received yet this attach (e.g. right after connect).
  int64 last_heartbeat_unix_ms = 5;
  // "" until the session's first StepActivated is sent.
  string current_step_id = 6;
  string current_step_name = 7;
}

// Force-closes a live Connect() stream server-side (cancels the gRPC context).
// The device sees its stream end and must reconnect -- it resumes the same
// session_id via register_or_resume_session, so this is disruptive but not
// destructive: no state is lost, the device just has to re-establish.
message DisconnectSessionRequest {
  string session_id = 1;
}

message DisconnectSessionResponse {
  bool ok = 1;
  string message = 2;
}

message TrackingState {
  string job_id = 1;
  string step_id = 2;
  TrackingStatus status = 3;
  float confidence = 4;
}

message UserAction {
  string job_id = 1;
  string step_id = 2;
  UserActionType action = 3;
}

message Heartbeat {
  string session_id = 1;
  int64 client_time_unix_ms = 2;
}

message Ping {
  string nonce = 1;
}

message CancelStep {
  string job_id = 1;
  string step_id = 2;
  string reason = 3;
}

// Pushed by the server when the live-sync pipeline produces a new manifest.
// `changed_steps` maps step_id -> new asset_version (sha256_xxx) for ONLY
// the steps whose content actually changed; unchanged steps are omitted.
// Empty map means the manifest was rewritten but no content changed
// (e.g. a no-op save) -- clients should ignore.
//
// Client behavior (per agreed design):
//   - If any changed step matches the worker's CURRENT step, interrupt and
//     re-fetch immediately, then re-render under the live Vuforia anchor.
//   - For other changed steps, invalidate the cached asset_version so the
//     next navigation to that step refetches from StreamStepAsset.
message ManifestUpdated {
  string job_id = 1;
  string new_workflow_version = 2;
  map<string, string> changed_steps = 3;
}

message ManifestRequest {
  string job_id = 1;
  string workflow_version = 2;
}

message AssetManifest {
  string job_id = 1;
  string workflow_version = 2;
  repeated StepAssetRef steps = 3;
}

message StepAssetRef {
  string step_id = 1;
  string part_id = 2;
  string asset_version = 3;
  string glb_url = 4;
  string step_json_url = 5;
  string target_version = 6;
  string target_url = 7;
}

message Fault {
  string code = 1;
  string message = 2;
  string correlation_id = 3;
  bool recoverable = 4;
}

message StepAssetStreamRequest {
  string job_id = 1;
  string step_id = 2;
  AssetCompression preferred_compression = 3;
  AssetType asset_type = 4;
}

message StepAssetChunk {
  string job_id = 1;
  string step_id = 2;
  string asset_version = 3;
  string file_name = 4;
  AssetCompression applied_compression = 5;
  int32 chunk_index = 6;
  bytes data = 7;
  bool is_last = 8;
}

enum TrackingStatus {
  TRACKING_STATUS_UNSPECIFIED = 0;
  TRACKING_STATUS_LOST = 1;
  TRACKING_STATUS_SEARCHING = 2;
  TRACKING_STATUS_ACQUIRED = 3;
}

enum UserActionType {
  USER_ACTION_TYPE_UNSPECIFIED = 0;
  USER_ACTION_TYPE_CONFIRM = 1;
  USER_ACTION_TYPE_REPLAY = 2;
  USER_ACTION_TYPE_NEXT = 3;
  USER_ACTION_TYPE_PREVIOUS = 4;
  USER_ACTION_TYPE_HELP = 5;
}

enum AssetCompression {
  ASSET_COMPRESSION_UNSPECIFIED = 0;
  ASSET_COMPRESSION_NONE = 1;
  ASSET_COMPRESSION_DRACO = 2;
}

enum AssetType {
  ASSET_TYPE_UNSPECIFIED = 0;
  ASSET_TYPE_GLB = 1;
  ASSET_TYPE_VUFORIA_TARGET = 2;
}

enum ControlAction {
  CONTROL_ACTION_UNSPECIFIED = 0;
  CONTROL_ACTION_NEXT = 1;
  CONTROL_ACTION_PREVIOUS = 2;
  CONTROL_ACTION_GOTO = 3;
}
